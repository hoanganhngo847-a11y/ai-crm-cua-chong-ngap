name: Supabase Backup CI (synthetic only)

on:
  pull_request:
    paths:
      - '.github/workflows/supabase-production-backup.yml'
      - '.github/workflows/supabase-backup-ci.yml'
      - 'scripts/production_backup/**'
      - 'tests/production_backup/**'
      - 'docs/SUPABASE_PRODUCTION_BACKUP.md'
  push:
    branches: [codex/supabase-production-backup]
    paths:
      - '.github/workflows/supabase-production-backup.yml'
      - '.github/workflows/supabase-backup-ci.yml'
      - 'scripts/production_backup/**'
      - 'tests/production_backup/**'
      - 'docs/SUPABASE_PRODUCTION_BACKUP.md'

permissions:
  contents: read

jobs:
  synthetic-backup-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install test tools (no Production secrets)
        run: |
          python -m pip install --require-hashes -r scripts/production_backup/requirements.txt
          python -m pip install ruff==0.14.3 PyYAML==6.0.3
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends age
      - name: Python lint and compile
        run: |
          ruff check --select E4,E7,E9,F scripts/production_backup tests/production_backup
          python -m compileall -q scripts/production_backup tests/production_backup
      - name: GitHub Actions expression and YAML lint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= .github/workflows/supabase-production-backup.yml .github/workflows/supabase-backup-ci.yml
      - name: YAML and workflow security contracts
        run: python -m unittest discover -s tests/production_backup -p 'test_*.py' -v
      - name: Real age and PostgreSQL 17.11 synthetic roundtrip
        run: python tests/production_backup/fixture_roundtrip.py
      - run: git diff --check
