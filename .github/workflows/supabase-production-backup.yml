name: Supabase Production Backup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Operation (backup never restores to Production)
        type: choice
        options: [backup, restore-rehearsal]
        default: backup
        required: true
      source_run_id:
        description: Successful backup workflow run ID (restore only)
        type: string
        default: ''
      source_run_attempt:
        description: Backup run attempt number (restore only)
        type: string
        default: '1'

permissions:
  contents: read

concurrency:
  group: supabase-production-backup-yrauljxzyklhisxijeim
  cancel-in-progress: false

jobs:
  backup:
    if: inputs.mode == 'backup' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production-backup
    timeout-minutes: 90
    steps:
      - name: Initialize private per-run workspace path
        run: echo "BACKUP_WORK_ROOT=$RUNNER_TEMP/crm-backup-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install pinned Python dependencies and age
        run: |
          python -m pip install --require-hashes -r scripts/production_backup/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends age
      - name: Export database snapshot and private Storage binaries
        id: export
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: python scripts/production_backup/main.py backup
      - name: Encrypt and verify ephemeral decryption roundtrip
        id: seal
        if: always() && steps.export.outcome != 'skipped'
        env:
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: python scripts/production_backup/main.py seal
      - name: Upload encrypted archive and sanitized aggregate report (14 days)
        if: always() && steps.seal.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supabase-production-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.BACKUP_WORK_ROOT }}/publish/production-backup.tar.gz.age
            ${{ env.BACKUP_WORK_ROOT }}/publish/backup-report.json
            ${{ env.BACKUP_WORK_ROOT }}/publish/checksums.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Remove plaintext and ephemeral test keys even on failure
        if: always()
        run: python scripts/production_backup/cleanup.py

  restore-rehearsal:
    if: inputs.mode == 'restore-rehearsal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: backup-rehearsal
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - name: Initialize private per-run workspace path
        run: echo "BACKUP_WORK_ROOT=$RUNNER_TEMP/crm-backup-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Validate source workflow run provenance
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
        run: python scripts/production_backup/main.py check-source
      - name: Download immutable encrypted artifact from selected run attempt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: supabase-production-backup-${{ inputs.source_run_id }}-${{ inputs.source_run_attempt }}
          path: ${{ env.BACKUP_WORK_ROOT }}/incoming
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
      - name: Install age
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends age
      - name: Verify, decrypt and restore in PostgreSQL 17.11 without network
        env:
          BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
        run: python scripts/production_backup/main.py restore
      - name: Upload sanitized restore result only (14 days)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supabase-restore-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BACKUP_WORK_ROOT }}/restore-publish/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove isolated database, plaintext and owner identity even on failure
        if: always()
        run: python scripts/production_backup/cleanup.py
