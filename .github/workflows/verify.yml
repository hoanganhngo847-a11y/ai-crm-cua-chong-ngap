name: Verify
on:
  pull_request:
  push:
    branches: [main, feature/facebook-website]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3
        with:
          version: '2.119.0'
      - run: npm ci
      - run: npm run test:migration-integrity
      - run: npm run test:customer-360
      - run: npm run test:campaigns
      - run: npm run test:ai-brain
      - run: npm run test:javis-brain
      - run: npm run build:javis-brain
      - run: supabase start -x studio,logflare,vector
      - run: supabase db reset --local
      - run: npx tsx --conditions=react-server --test tests/ai-brain/zalo-sla-retry-db.test.ts
      - run: npm run test:customer-360:db
      - run: npm run test:campaigns:db
      - run: npx tsx --conditions=react-server --test tests/ai-brain/memory-db.test.ts
      - run: npx tsx --conditions=react-server --test tests/ai-brain/shadow-db.test.ts
      - run: npx tsx --conditions=react-server --test tests/ai-brain/live-db.test.ts
      - run: npx tsx --conditions=react-server --test tests/ai-brain/live-messenger-db.test.ts
      - run: npx tsx --conditions=react-server --test tests/ai-brain/live-messenger-supabase.test.ts
      - run: npx tsx --conditions=react-server --test tests/ai-brain/handover-db.test.ts
      - run: npx tsx --conditions=react-server --test tests/ai-brain/grounding-db.test.ts
      - run: npx tsx --conditions=react-server --test tests/ai-brain/control-center-db.test.ts
      - run: npx tsx --conditions=react-server --test tests/ai-brain/monitoring-db.test.ts
      - run: npx tsx --conditions=react-server --test tests/ai-brain/tenant-rpc-security-db.test.ts
      - run: sudo DEBIAN_FRONTEND=noninteractive apt-get update -y && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg
      - run: npm run test:zalo-recordings
      - run: npm run test:zalo-recordings:db
      - run: npm run test:idempotency:db
      - run: npm run test:meta-messenger
      - run: npm run test:meta-deletion:db
      - run: npm run test:integration-gate
      - run: npm run test:fixture-repeatability
      - run: npm run test:omnichannel
      - run: npm run test:omnichannel:db
      - run: npm run test:voice
      - run: npm run build
      - run: git diff --check

  meta-ads-code:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-fixture-anon-key
      SUPABASE_SERVICE_ROLE_KEY: local-fixture-service-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: dependencies
        run: npm ci
      - run: npm run test:migration-integrity
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:meta-ads
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:omnichannel
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run typecheck
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run lint
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run build

  meta-ads-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3
        with:
          version: '2.119.0'
      - run: npm ci
      - name: Replay active migrations in a disposable Supabase stack
        id: replay
        run: |
          supabase start -x studio,logflare,vector
          supabase db reset --local
          pg_version=$(docker exec supabase_db_ai-crm-cua-chong-ngap psql -X -U postgres -d postgres -Atc 'show server_version_num')
          test "$pg_version" = 170011
          docker exec supabase_db_ai-crm-cua-chong-ngap psql -X -U postgres -d postgres -Atc 'select version()'
      - run: npm run test:meta-ads:db
      - if: ${{ !cancelled() && steps.replay.outcome == 'success' }}
        run: npm run test:omnichannel:db
